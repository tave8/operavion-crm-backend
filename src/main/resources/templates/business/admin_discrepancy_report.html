<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Report</title>
    <style>
        /* PDF Page Setup with tight padding */
        @page {
            size: A4;
            margin: 15mm 15mm 20mm 15mm;
        }
        
        body { 
            font-family: sans-serif; 
            margin: 0;
            padding: 0;
            color: #333333;
            font-size: 13px;
            line-height: 1.4;
        }
        
        /* Centered Header */
        .header {
            text-align: center;
            margin-bottom: 25mm;
        }
        
        .header h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            color: #111111;
        }
        
        /* Compact Table Layout */
        table { 
            border-collapse: collapse; 
            width: 100%; 
        }
        
        th, td { 
            border: 1px solid #e0e0e0; 
            padding: 8px 12px; 
            text-align: left; 
        }
        
        th { 
            background-color: #f8f9fa; 
            font-weight: bold;
            color: #444444;
        }
        
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        
        /* Minimal Fixed Footer */
        .footer {
            position: fixed;
            /* Changed to 0 to keep it securely inside the 20mm page margin */
            bottom: 0px; 
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: #888888;
            border-top: 1px solid #eeeeee;
            padding-top: 5px;
        }
    </style>
</head>
<body>

<!-- FIX 1: Moving fixed elements to the absolute top of the body resolves the missing footer bug -->
<div class="footer">
    <span><a href="https://www.zerochiamate.com">zerochiamate.com</a></span>
</div>

<!-- Centered Page Title Section -->
<div class="header">
    <h1 th:text="|Report discrepanze, Settimana ${startDate} - ${endDate}|"></h1>
</div>

<!-- Discrepancy List -->
<!-- Discrepancy List -->
<div style="margin-top: 20px;">
    <!-- Single loop directly over your list of DTOs -->
    <div th:each="item : ${discrepancies}" style="margin-bottom: 25px; page-break-inside: avoid;">

        <!-- Client & Address Line -->
        <div style="font-weight: bold; font-size: 14px; color: #111111;">
            <span th:text="${item.clientName} ?: 'Cliente Sconosciuto'">Nome Cliente</span>
            <span th:if="${item.addressName}" th:text="| - ${item.addressName}|" style="font-weight: normal; color: #666666; font-size: 13px;"> - Nome Sede</span>
        </div>

        <!-- Discrepancy Text Line -->
        <div style="margin-top: 4px; color: #444444;"
             th:text="${item.discrepancy}">
            Dettaglio Discrepanza
        </div>

    </div>
</div>

</body>
</html>
