<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 32px;
        color: #333;
    }
    .container {
        background-color: #ffffff;
        border-radius: 8px;
        padding: 32px;
        max-width: 720px;
        margin: auto;
        border-left: 6px solid #e53e3e;
    }
    h1 {
        color: #e53e3e;
        font-size: 20px;
        margin-bottom: 4px;
    }
    .subtitle {
        color: #888;
        font-size: 13px;
        margin-bottom: 24px;
    }
    .grid {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 10px 16px;
        margin-bottom: 24px;
    }
    .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        padding-top: 2px;
    }
    .value {
        font-size: 14px;
        color: #333;
        font-weight: 500;
    }
    .badge {
        display: inline-block;
        border-radius: 4px;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: bold;
    }
    .badge-failed {
        background-color: #fff5f5;
        color: #e53e3e;
        border: 1px solid #fed7d7;
    }
    .badge-abandoned {
        background-color: #fffaf0;
        color: #dd6b20;
        border: 1px solid #feebc8;
    }
    .section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin-bottom: 8px;
    }
    .reason {
        background-color: #fff5f5;
        border: 1px solid #fed7d7;
        border-radius: 6px;
        padding: 12px 16px;
        font-size: 14px;
        color: #c53030;
        margin-bottom: 24px;
    }
    .stacktrace {
        background-color: #1a1a1a;
        color: #f8f8f2;
        font-family: monospace;
        font-size: 12px;
        padding: 16px;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-all;
    }
    .divider {
        border: none;
        border-top: 1px solid #eee;
        margin: 24px 0;
    }
  </style>
</head>
<body>
<div class="container">

  <h1>⚠ Job Execution Alert</h1>
  <div class="subtitle" th:text="'Occurred at: ' + ${finishedAt}"></div>

  <div class="grid">

    <div class="label">Job</div>
    <div class="value" th:text="${jobName}"></div>

    <div class="label">Execution ID</div>
    <div class="value" th:text="${executionId}"></div>

    <div class="label">State</div>
    <div class="value">
                <span class="badge badge-failed"
                      th:if="${state == 'FAILED'}"
                      th:text="${state}"></span>
      <span class="badge badge-abandoned"
            th:if="${state == 'ABANDONED'}"
            th:text="${state}"></span>
    </div>

    <div class="label">Started At</div>
    <div class="value" th:text="${startedAt}"></div>

    <div class="label">Finished At</div>
    <div class="value" th:text="${finishedAt}"></div>

    <div class="label">Retry Count</div>
    <div class="value" th:text="${retryCount} + ' / ' + ${maxRetries}"></div>

    <div class="label">Item ID</div>
    <div class="value" th:text="${itemId}"></div>

  </div>

  <hr class="divider"/>

  <div th:if="${reason != null}">
    <div class="section-title">Reason</div>
    <div class="reason" th:text="${reason}"></div>
  </div>

  <div th:if="${stackTrace != null}">
    <div class="section-title">Stack Trace</div>
    <div class="stacktrace" th:text="${stackTrace}"></div>
  </div>

</div>
</body>
</html>
