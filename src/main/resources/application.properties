# In which environment is this server running
# Possible values: "LOCAL" | "PREVIEW" | "PRODUCTION"
whereami=${WHEREAMI}

# Spring framework 
spring.application.name=zerochiamate-backend
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.mvc.favicon.enabled=false

# Spring Boot autoconfiguration logs
#logging.level.org.springframework.boot.autoconfigure=DEBUG

# Comment/uncomment these 4 properties if you need logging of SQL queries
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Comment/uncomment these 2 properties for more debugging
# Flyway debug logs
#logging.level.org.flywaydb=DEBUG

# Forgot password time-based security mechanism. 
# Possible values: "true" | "false"
# Can be therefore disabled, for development purposes 
forgotpassword.time-constraint.enabled=${FORGOT_PASSWORD_TIME_CONSTRAINT_ENABLED}

# Web server
server.url=${SERVER_URL}
server.port=${SERVER_PORT}

# Database
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ***************************************+++
# Flyway migration configuration.
# NOTE: Spring Boot 4.0.5 does not autoconfigure Flyway correctly,
# so these properties are currently ignored by Spring Boot.
# Flyway is instead configured manually as a bean in FlywayConfig.
# These properties are kept here for documentation and future compatibility.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Hibernate must not touch the schema, Flyway owns it.
spring.jpa.hibernate.ddl-auto=none
# ***************************************+++



# Hibernate ORM
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Json Web Token
jwt.secret=${JWT_SECRET}

# Frontend URLs
frontend.production.url=${FRONTEND_PRODUCTION_URL}
frontend.preview.url=${FRONTEND_PREVIEW_URL}
frontend.preview.url-pattern=${FRONTEND_PREVIEW_URL_PATTERN}
frontend.local.url=${FRONTEND_LOCAL_URL}

# Email sending
email.sender-domain=${EMAIL_SENDER_DOMAIN}
email.sender-user=${EMAIL_SENDER_USER}
email.sender-name=${EMAIL_SENDER_NAME}

# Cloudinary API (media upload)
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.apikey=${CLOUDINARY_API_KEY}
cloudinary.secret=${CLOUDINARY_API_SECRET}

# Cloudflare API (file upload)
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL}

# Resend API (send email)
resend.apikey=${RESEND_API_KEY}

# Anthropic API (AI)
anthropic.api-key=${ANTHROPIC_API_KEY}

# Geoapify API (geocoding)
geoapify-apikey=${GEOAPIFY_API_KEY}

# ---------- Stripe API (payments)  ----------------
# the API key
stripe-api.secret-key=${STRIPE_API_SECRET_KEY}
# the secret we use to authenticate requests going to our webhook endpoints
stripe-api.webhook-secret=${STRIPE_API_WEBHOOK_SECRET}
# the product we're selling (the software) and its price point
stripe-api.price-id=${STRIPE_API_PRICE_ID}